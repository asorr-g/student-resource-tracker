<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Academic Resource Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>📚 Academic Resource Tracker</h1>
    <nav>
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="resources">Resources</button>
      <button class="tab" data-tab="courses">Courses</button>
    </nav>
  </header>

  <main>
    <!-- DASHBOARD -->
    <section id="tab-dashboard" class="panel">
      <div id="kpis" class="kpis"></div>
      <div class="grid2">
        <div class="card"><h2>Progress by course</h2><div id="byCourse"></div></div>
        <div class="card"><h2>Upcoming deadlines</h2><div id="upcoming"></div></div>
        <div class="card"><h2>Resources by type</h2><div id="byType"></div></div>
        <div class="card"><h2>Open items by priority</h2><div id="byPriority"></div></div>
      </div>
    </section>

    <!-- RESOURCES -->
    <section id="tab-resources" class="panel" hidden>
      <div class="toolbar">
        <input id="f-q" type="search" placeholder="Search title, notes, tags…">
        <select id="f-course"></select>
        <select id="f-type"></select>
        <select id="f-status"></select>
        <select id="f-priority"></select>
        <label class="chk"><input id="f-overdue" type="checkbox"> Overdue only</label>
        <span class="spacer"></span>
        <a class="btn" href="/api/export/csv">⬇ Export CSV</a>
        <button class="btn primary" id="btn-add-resource">+ Add resource</button>
      </div>
      <div class="card tablewrap">
        <table>
          <thead><tr><th>Title</th><th>Course</th><th>Type</th><th>Priority</th><th>Due</th><th>Status</th><th></th></tr></thead>
          <tbody id="resource-rows"></tbody>
        </table>
        <p id="resource-empty" class="empty" hidden>No resources match your filters.</p>
      </div>
    </section>

    <!-- COURSES -->
    <section id="tab-courses" class="panel" hidden>
      <div class="toolbar">
        <span class="spacer"></span>
        <button class="btn primary" id="btn-add-course">+ Add course</button>
      </div>
      <div class="card tablewrap">
        <table>
          <thead><tr><th>Code</th><th>Title</th><th>Lecturer</th><th>Semester</th><th>Resources</th><th></th></tr></thead>
          <tbody id="course-rows"></tbody>
        </table>
        <p id="course-empty" class="empty" hidden>No courses yet. Add your first one.</p>
      </div>
    </section>
  </main>

  <!-- Resource dialog -->
  <dialog id="dlg-resource">
    <form method="dialog" id="form-resource">
      <h3 id="dlg-resource-title">Add resource</h3>
      <label>Title *<input name="title" required maxlength="200"></label>
      <div class="row">
        <label>Course *<select name="courseId" required></select></label>
        <label>Type<select name="type"></select></label>
      </div>
      <div class="row">
        <label>Status<select name="status"></select></label>
        <label>Priority<select name="priority"></select></label>
        <label>Due date<input name="dueDate" type="date"></label>
      </div>
      <label>Link (URL)<input name="url" type="url" placeholder="https://…"></label>
      <label>Tags (comma separated)<input name="tags" placeholder="exam, revision"></label>
      <label>Notes<textarea name="notes" rows="3" maxlength="2000"></textarea></label>
      <p class="error" id="resource-error" hidden></p>
      <div class="actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Course dialog -->
  <dialog id="dlg-course">
    <form method="dialog" id="form-course">
      <h3 id="dlg-course-title">Add course</h3>
      <div class="row">
        <label>Code *<input name="code" required maxlength="20" placeholder="CS 301"></label>
        <label>Semester<input name="semester" maxlength="40" placeholder="Semester 1"></label>
      </div>
      <label>Title *<input name="title" required maxlength="120"></label>
      <label>Lecturer<input name="lecturer" maxlength="80"></label>
      <p class="error" id="course-error" hidden></p>
      <div class="actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
